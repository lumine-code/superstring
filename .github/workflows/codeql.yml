name: CodeQL

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript, cpp
      - run: npm ci
      # cpp analysis only sees code it watches being compiled, so build the
      # addon between init and analyze rather than relying on npm ci, which
      # skips the rebuild whenever a usable binding is already present.
      - run: npm run build:node
      - uses: github/codeql-action/analyze@v4
