name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    env:
      MACOSX_DEPLOYMENT_TARGET: "13.5"
      GYP_DEFINES: "mac_deployment_target=13.5"
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 24
          - os: macos-latest
            node: 24
          - os: windows-latest
            node: 24
    steps:
      - name: Enable Git symlinks on Windows
        if: runner.os == 'Windows'
        run: git config --global core.symlinks true
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - name: Install dependencies
        run: npm ci
      - name: Validate macOS release library
        if: runner.os == 'macOS'
        run: node script/check-macos-build.js build/Release
      - name: Run tests
        run: npm run test:node && npm run test:native
      - name: Validate macOS debug libraries
        if: runner.os == 'macOS'
        run: node script/check-macos-build.js build/Debug
      - name: Validate package contents
        run: npm pack --dry-run
